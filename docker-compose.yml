version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    ports:
      - 8000:8000
    environment:
      - DATA_DRAKE_AUTH_TOKEN=vWgDnAdwNUhgtHgDDlinphDaz
    volumes:
      - /opt/datahoard:/mnt/datahoard
      - /opt/proxmox:/mnt/proxmox
      - /opt/plex/data:/mnt/plex
      - /opt/pyload:/mnt/pyload
      - /opt/syncthing/data/yalt:/mnt/yalt
      - /opt/transmission/data:/mnt/transmission
      - ./database:/app/backend/database
#      - /opt/DataDrake/persistence:/app/backend
    restart: unless-stopped
 

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    network_mode: host
    # ports: 
    #   - 4173:4173  
    restart: unless-stopped
